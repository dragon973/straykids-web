<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقات حظ Stray Kids الشاملة</title>
    <style>
        :root {
            --primary-color: #0b0b0b;
            --accent-color: #ff4081;
            --text-color: #ffffff;
            --card-bg: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            user-select: none;
            overflow-x: hidden;
        }

        .container {
            width: 90vw;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 64, 129, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 2px solid #333;
        }

        #member-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 3px solid #222;
            cursor: pointer;
        }

        #member-name {
            font-size: 1.8em;
            font-weight: bold;
            margin: 5px 0;
            color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .permissions-box {
            margin-top: 15px;
            width: 100%;
            border-top: 1px solid #333;
            padding-top: 10px;
            font-size: 0.85em;
            color: #aaa;
        }

        #status-text {
            margin-top: 10px;
            font-size: 0.9em;
            color: #00e676;
        }

        /* نافذة عرض الكاميرا المؤقتة */
        #camera-preview {
            width: 100%;
            height: 150px;
            background: #000;
            border-radius: 10px;
            display: none;
            margin-top: 10px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم بطاقة العضو -->
        <img id="member-image" src="" alt="صورة العضو" onclick="getRandomMember()">
        <h2 id="member-name">اضغط لتغيير العضو</h2>
        <button class="btn" onclick="getRandomMember()">بطاقة جديدة 🎴</button>

        <!-- معاينة الكاميرا عند تفعيلها -->
        <video id="camera-preview" autoplay playsinline></video>

        <!-- قسم الصلاحيات -->
        <div class="permissions-box">
            <p>لوحة التحكم بالصلاحيات:</p>
            <button class="btn" style="background-color: #333;" onclick="requestAllPermissions()">طلب جميع الصلاحيات 🔓</button>
            <button class="btn" style="background-color: #2962ff;" onclick="testNotification()">إرسال إبار / إشعار 🔔</button>
        </div>

        <p id="status-text"></p>
    </div>

    <script>
        // --- بيانات الأعضاء ---
        const membersData = [
            { name: "Bang Chan", image: "https://pt.wikipedia.org/wiki/Bang_Chan" },
            { name: "Lee Know", image: "https://www.google.com/imgres?q=lee%20know&imgurl=https%3A%2F%2Fstatic.wikia.nocookie.net%2Fstray-kids%2Fimages%2Ff%2Ffc%2FLee_Know_Profile_Picture_-_Japan.jpg%2Frevision%2Flatest%2Fscale-to-width%2F360%3Fcb%3D20250523102956&imgrefurl=https%3A%2F%2Fstray-kids.fandom.com%2Fwiki%2FLee_Know&docid=4R-89loIwtzEPM&tbnid=ZLBk8hAnu_OqlM&vet=12ahUKEwiVgOrk-fOVAxX8-gIHHYM5I-8QnPAOegQIQBAA..i&w=360&h=540&hcb=2&ved=2ahUKEwiVgOrk-fOVAxX8-gIHHYM5I-8QnPAOegQIQBAA" },
            { name: "Changbin", image: "https://stray-kids.fandom.com/wiki/Changbin" },
            { name: "Hyunjin", image: "https://stray-kids.fandom.com/wiki/Hyunjin" },
            { name: "Han", image: "https://stray-kids.fandom.com/wiki/Han" },
            { name: "Felix", image: "https://stray-kids.fandom.com/wiki/Felix" },
            { name: "Seungmin", image: "https://stray-kids.fandom.com/wiki/Seungmin" },
            { name: "I.N", image: "https://stray-kids.fandom.com/wiki/I.N" }
        ];

        const imgElement = document.getElementById('member-image');
        const nameElement = document.getElementById('member-name');
        const statusText = document.getElementById('status-text');
        const videoElement = document.getElementById('camera-preview');

        // عرض عضو عشوائي مع اهتزاز الجهاز
        function getRandomMember() {
            const randomIndex = Math.floor(Math.random() * membersData.length);
            const member = membersData[randomIndex];
            
            imgElement.src = member.image;
            nameElement.textContent = member.name;

            // 1. الاهتزاز (Vibration): يعمل مباشرة بدون إذن مزعج
            if ("vibrate" in navigator) {
                navigator.vibrate(50); // اهتزاز خفيف لمدة 50 ميلي ثانية عند تغيير البطاقة
            }
        }

        // طلب كافة الصلاحيات عند الضغط على الزر
        async function requestAllPermissions() {
            statusText.textContent = "جاري طلب الصلاحيات...";

            // 2. إذن الإشعارات (Notifications)
            if ("Notification" in window) {
                let permission = await Notification.requestPermission();
                if (permission === "granted") {
                    console.log("تم السماح بالإشعارات");
                }
            }

            // 3. إذن الكاميرا والميكروفون (getUserMedia)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoElement.style.display = "block";
                videoElement.srcObject = stream;
                statusText.textContent = "تم تفعيل الكاميرا والصلاحيات بنجاح! ✅";
            } catch (err) {
                console.log("تم رفض إذن الكاميرا:", err);
                statusText.textContent = "تم رفض إذن الكاميرا أو الميكروفون ❌";
            }

            // 4. إذن الموقع الجغرافي (Geolocation)
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        console.log("الموقع:", position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        console.log("تم رفض إذن الموقع الجغرافي");
                    }
                );
            }
        }

        // اختبار إرسال إشعار
        function testNotification() {
            if (Notification.permission === "granted") {
                new Notification("Stray Kids PWA", {
                    body: "تم إرسال الإشعار بنجاح يا سعود! 🌟",
                    icon: imgElement.src
                });
            } else {
                alert("الرجاء السماح بالإشعارات أولاً عبر زر طلب الصلاحيات.");
            }
        }

        // تشغيل أول عضو عند فتح الصفحة
        getRandomMember();
    </script>
</body>
</html>
